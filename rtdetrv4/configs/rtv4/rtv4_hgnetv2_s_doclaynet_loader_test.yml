__include__:
  - ../rtv4/rtv4_hgnetv2_s_coco.yml

output_dir: ./outputs/rtv4_hgnetv2_s_doclaynet_loader_test

num_classes: 11
remap_mscoco_category: False

HGNetv2:
  pretrained: False

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/user/Projects/Document-Layout-Parsing-using-OCR/data/doclaynet/PNG
    ann_file: /home/user/Projects/Document-Layout-Parsing-using-OCR/data/doclaynet/subsets/val_16.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - type: Resize
          size: [640, 640]
        - type: ConvertPILImage
          dtype: float32
          scale: True
  shuffle: False
  num_workers: 0
  drop_last: False
  total_batch_size: 1
  collate_fn:
    type: BatchImageCollateFunction
