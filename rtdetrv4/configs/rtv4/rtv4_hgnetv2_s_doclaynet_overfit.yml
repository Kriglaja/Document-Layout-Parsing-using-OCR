__include__:
  - ./rtv4_hgnetv2_s_coco.yml

output_dir: ./outputs/rtv4_hgnetv2_s_doclaynet_overfit

num_classes: 11
remap_mscoco_category: false

epoches: 1
print_freq: 1
checkpoint_freq: 1
warmup_iter: 32
use_amp: true

HGNetv2:
  pretrained: false

teacher_model:
  type: DINOv3TeacherModel
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

eval_spatial_size: [640, 640]

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 32

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /var/home/user/Projects/Document-Layout-Parsing-using-OCR/data/doclaynet/PNG
    ann_file: /var/home/user/Projects/Document-Layout-Parsing-using-OCR/data/doclaynet/subsets/train_32_all_classes_rtdetr.json
    return_masks: false
    transforms:
      type: Compose
      ops:
        - type: Resize
          size: [640, 640]
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: ConvertPILImage
          dtype: float32
          scale: true
        - type: ConvertBoxes
          fmt: cxcywh
          normalize: true
  shuffle: true
  num_workers: 0
  drop_last: false
  total_batch_size: 1
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    mixup_prob: 0.0

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /var/home/user/Projects/Document-Layout-Parsing-using-OCR/data/doclaynet/PNG
    ann_file: /var/home/user/Projects/Document-Layout-Parsing-using-OCR/data/doclaynet/subsets/val_16_rtdetr.json
    return_masks: false
    transforms:
      type: Compose
      ops:
        - type: Resize
          size: [640, 640]
        - type: ConvertPILImage
          dtype: float32
          scale: true
  shuffle: false
  num_workers: 0
  drop_last: false
  total_batch_size: 1
  collate_fn:
    type: BatchImageCollateFunction
